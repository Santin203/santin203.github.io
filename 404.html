<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Santiago Jiménez Casas</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <style>
    .nf { min-height: 100vh; display: grid; place-content: center; gap: 20px; padding: 40px 16px; }
    .nf .code { font-family: var(--font-mono); color: var(--accent); font-size: 14px; margin: 0; }
    .nf h1 { font-family: var(--font-display); font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1.05; letter-spacing: -0.02em; }
    .nf h1 em { color: var(--accent); }
    .nf p { color: var(--ink-soft); max-width: 44ch; margin: 0; }
  </style>
</head>
<body>
  <main class="nf wrap">
    <p class="code">KeyError: 404</p>
    <h1>This row isn't in <em>the dataset.</em></h1>
    <p>The page you were looking for doesn't exist or has moved.</p>
    <div><a class="btn btn-primary" href="/">Back to the homepage</a></div>
  </main>
</body>
</html>
